<title>CUORE</title>
<!-- CUORE, prototipo locale v2. Aperta come file: SOLO DATI DIMOSTRATIVI. Servita dal ponte locale (app/bridge/serve.py,
     solo 127.0.0.1): CUORE School legge /api/school e CUORE Money /api/money, entrambi in sola lettura.
     Due dashboard distinte con design system comune: CUORE School (forma di cloud.school.dashboard/1) e
     CUORE Money (forma della consultazione v1 di Cloud Finance). Nessun dato passa da una dashboard all'altra. -->
<style>
/* Stile «strumento pro» (06/11/2026, docs/CUORE-brief-grafica-2026-11-06.md): fondo quasi nero, grigi in tre livelli,
   due accenti (verde Finance, viola School), rosso e ambra solo per gli stati. SF Pro di sistema, scala 11 · 12,5 · 14 ·
   18 · 26 px, cifre tabellari. Griglia a 12 colonne sul contenitore (1 colonna sotto i 700 px), riquadri della stessa
   altezza per riga, icone SVG lineari da 16 px. Scuro predefinito; il chiaro resta disponibile nelle Impostazioni. */
:root {
  --bg: #0b0c0f; --surface: #121317; --surface-2: #17191e; --line: #24262d; --line-2: #2e3139;
  --text: #e8e9ec; --muted: #9a9ca5; --faint: #6b6e78; --on-accent: #0b0c0f;
  --school: #9d8cff; --school-soft: rgba(157,140,255,.15); --money: #3ecf8e; --money-soft: rgba(62,207,142,.14);
  --system: #b4b7c0; --system-soft: rgba(180,183,192,.12);
  --good: #3ecf8e; --warn: #e9a23b; --bad: #f0616d; --good-soft: rgba(62,207,142,.14); --warn-soft: rgba(233,162,59,.15); --bad-soft: rgba(240,97,109,.15);
  --c2: #e9a23b; --c3: #9d8cff; --c4: #5ab0f0; --c5: #e57fb0; --c6: #7cc36a; --c7: #e38a5c; --c8: #8b8e98;
  --accent: var(--text); --accent-soft: var(--surface-2);
  --r: 10px; --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) { :root[data-theme="auto"] { color-scheme: dark; } }
@media (prefers-color-scheme: light) {
  :root[data-theme="auto"] {
    --bg: #f6f6f8; --surface: #ffffff; --surface-2: #f1f1f4; --line: #e3e3e8; --line-2: #d5d5dc; --text: #16171b; --muted: #5d606a; --faint: #8b8e98; --on-accent: #ffffff;
    --school: #6a55e8; --school-soft: rgba(106,85,232,.12); --money: #12935f; --money-soft: rgba(18,147,95,.12); --system: #4b4f5a; --system-soft: rgba(75,79,90,.1);
    --good: #12935f; --warn: #b8740f; --bad: #d23b48; --good-soft: rgba(18,147,95,.12); --warn-soft: rgba(184,116,15,.13); --bad-soft: rgba(210,59,72,.12);
    --c2: #b8740f; --c3: #6a55e8; --c4: #2a87cf; --c5: #c2457f; --c6: #4f9a3d; --c7: #c4683b; --c8: #9a9ca5; color-scheme: light;
  }
}
:root[data-theme="light"] {
    --bg: #f6f6f8; --surface: #ffffff; --surface-2: #f1f1f4; --line: #e3e3e8; --line-2: #d5d5dc; --text: #16171b; --muted: #5d606a; --faint: #8b8e98; --on-accent: #ffffff;
    --school: #6a55e8; --school-soft: rgba(106,85,232,.12); --money: #12935f; --money-soft: rgba(18,147,95,.12); --system: #4b4f5a; --system-soft: rgba(75,79,90,.1);
    --good: #12935f; --warn: #b8740f; --bad: #d23b48; --good-soft: rgba(18,147,95,.12); --warn-soft: rgba(184,116,15,.13); --bad-soft: rgba(210,59,72,.12);
    --c2: #b8740f; --c3: #6a55e8; --c4: #2a87cf; --c5: #c2457f; --c6: #4f9a3d; --c7: #c4683b; --c8: #9a9ca5; color-scheme: light;
}
:root[data-app="school"] { --accent: var(--school); --accent-soft: var(--school-soft); }
:root[data-app="money"] { --accent: var(--money); --accent-soft: var(--money-soft); }
:root[data-app="cuore"], :root[data-app="home"] { --accent: var(--system); --accent-soft: var(--system-soft); }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid color-mix(in srgb, var(--accent) 70%, transparent); outline-offset: 2px; border-radius: 6px; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.app { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100vh; }

/* barra laterale: Mac e iPad orizzontale */
.side { position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 16px 10px; border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 1px; }
.brand { display: flex; align-items: center; gap: 9px; padding: 4px 10px 14px; font-weight: 650; font-size: 13px; letter-spacing: .16em; border: 0; background: none; cursor: pointer; text-align: left; color: var(--text); }
.switch { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2px; padding: 2px; margin: 0 2px 12px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); }
.switch button { border: 0; border-radius: 6px; padding: 5px 6px; background: none; cursor: pointer; font-size: 12.5px; font-weight: 550; color: var(--muted); }
.switch button[aria-current="page"] { background: var(--surface-2); color: var(--text); }
.switch button[data-route^="school"][aria-current="page"] { color: var(--school); }
.switch button[data-route^="money"][aria-current="page"] { color: var(--money); }
.nav-btn { display: flex; align-items: center; gap: 9px; width: 100%; padding: 6px 10px; min-height: 32px; border: 0; border-radius: 7px; background: none; cursor: pointer; text-align: left; color: var(--muted); font-size: 13px; }
.nav-btn:hover { background: var(--surface-2); color: var(--text); }
.nav-btn[aria-current="page"] { background: var(--surface-2); color: var(--text); font-weight: 550; }
.nav-btn[aria-current="page"] .ic { color: var(--accent); }
.nav-btn .ic { width: 16px; display: grid; place-items: center; flex: none; }
.nav-btn .soon { margin-left: auto; white-space: nowrap; flex: none; font: 500 10px var(--mono); color: var(--faint); border: 1px solid var(--line-2); border-radius: 4px; padding: 0 5px; }
.side-bottom { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line); }

/* barra superiore e sotto-sezioni: iPad verticale e iPhone */
.subnav { display: none; }
.tabs { display: none; }

main { padding: 20px clamp(16px, 3vw, 36px) 56px; max-width: 1240px; width: 100%; min-width: 0; container-type: inline-size; }
.link { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-size: inherit; font-weight: 550; }
.link:hover { text-decoration: underline; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
.dot.good { background: var(--good); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; margin-bottom: 14px; min-height: 34px; }
.head h1 { margin: 0; font-size: 18px; font-weight: 620; letter-spacing: -.01em; line-height: 1.25; }
.head p { margin: 2px 0 0; color: var(--faint); font-size: 12.5px; }
.head .side-acts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 99px; font-size: 11px; font-weight: 550; background: var(--surface-2); color: var(--muted); white-space: nowrap; text-decoration: none; border: 0; line-height: 1.7; }
button.chip { cursor: pointer; }
.chip.acc { background: var(--accent-soft); color: var(--accent); }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.sch { background: var(--school-soft); color: var(--school); }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(12, minmax(0, 1fr)); align-items: stretch; }
.grid + .grid { margin-top: 12px; }
.card { grid-column: span 12; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.card:not(.kpi) { container-type: inline-size; }
.card > h2 { margin: 0; font-size: 13px; font-weight: 600; color: var(--text); letter-spacing: 0; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 8px; min-height: 26px; }
.card > h2 > span:first-child { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
.card > h2 > .hx { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.ptile .chip:not(.good):not(.bad):not(.warn) { background: var(--surface); }
.card h2 small { color: var(--faint); font-size: 12px; font-weight: 400; }
.hic { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; flex: none; background: var(--surface-2); color: var(--muted); }
.hic.m { background: var(--money-soft); color: var(--money); } .hic.s { background: var(--school-soft); color: var(--school); }
.hic.b { background: var(--bad-soft); color: var(--bad); } .hic.w { background: var(--warn-soft); color: var(--warn); }
.card > .foot { margin-top: auto; }
.s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s6 { grid-column: span 6; } .s7 { grid-column: span 7; } .s8 { grid-column: span 8; } .s12 { grid-column: span 12; }
.kpi { gap: 4px; justify-content: space-between; }
.kpi .l { font-size: 12px; color: var(--muted); }
.kpi .v { font-size: 26px; font-weight: 620; letter-spacing: -.02em; line-height: 1.15; font-variant-numeric: tabular-nums; }
.kpi .v.txt { font-size: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kpi .v.na, .kpi .v .na { font-size: 14px; font-weight: 550; color: var(--muted); letter-spacing: 0; }
.kpi .s { color: var(--faint); font-size: 12px; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); min-width: 0; }
.list li:first-child { border-top: 0; padding-top: 0; }
.list .main { flex: 1; min-width: 0; }
.list .t { font-weight: 550; overflow-wrap: anywhere; }
.list .d { color: var(--muted); font-size: 12.5px; }
.list .r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.date { flex: none; width: 40px; text-align: center; border-radius: 7px; padding: 3px 0; background: var(--surface-2); line-height: 1.15; border: 1px solid var(--line); }
.date b { display: block; font-size: 14px; font-weight: 620; font-variant-numeric: tabular-nums; } .date span { font: 500 10px var(--mono); color: var(--faint); text-transform: uppercase; }
.grade { flex: none; width: 36px; height: 30px; border-radius: 7px; display: grid; place-items: center; font-weight: 620; font-variant-numeric: tabular-nums; font-size: 13px; }
.bar-row { display: grid; grid-template-columns: minmax(70px, min(170px, 36%)) minmax(40px, 1fr) auto; align-items: center; gap: 10px; padding: 5px 0; font-size: 13px; }
.bar-row > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.barbtn { display: block; width: 100%; border: 0; background: none; padding: 0; text-align: left; cursor: pointer; border-radius: 6px; color: inherit; font: inherit; }
.barbtn[disabled] { cursor: default; }
.barbtn .track, .barbtn .fill { display: block; }
.barbtn:not([disabled]):hover .bar-row > span:first-child { text-decoration: underline; }
.track { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.fill { height: 100%; border-radius: 99px; background: var(--accent); }
.bar-row .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); min-width: 64px; }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11.5px; color: var(--muted); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.note { color: var(--faint); font-size: 12px; margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.pos { color: var(--good); } .neg { color: var(--bad); } .sch { color: var(--school); }
.empty { padding: 14px 4px 4px; color: var(--faint); font-size: 12.5px; display: grid; gap: 8px; }
.empty::before { content: ""; height: 6px; border-radius: 99px; background: repeating-linear-gradient(90deg, var(--line-2) 0 6px, transparent 6px 10px); }
.empty b { color: var(--muted); font-weight: 550; }
.empty-bar { height: 6px; border-radius: 99px; background: repeating-linear-gradient(90deg, var(--line-2) 0 6px, transparent 6px 10px); }
.future { padding: 12px 14px; border-radius: 8px; background: var(--surface-2); color: var(--muted); font-size: 13px; }
.future b { color: var(--text); }
details.more > summary { cursor: pointer; color: var(--faint); font-size: 12px; list-style: none; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::before { content: "▸ "; } details.more[open] > summary::before { content: "▾ "; }

/* controlli: segmenti, barra dei filtri */
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 2px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); }
.seg button { border: 0; background: none; border-radius: 6px; padding: 3px 10px; font-size: 12.5px; color: var(--muted); cursor: pointer; min-height: 28px; }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--text); font-weight: 550; box-shadow: inset 0 0 0 1px var(--line-2); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; font-size: 12.5px; color: var(--muted); }
.card .toolbar { margin: 0; }
.toolbar input, .toolbar select { min-width: 0; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font-size: 13px; min-height: 32px; }
.toolbar input { flex: 1 1 220px; -webkit-appearance: none; appearance: none; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filters button { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 3px 10px; font-size: 12.5px; cursor: pointer; color: var(--muted); min-height: 28px; }
.filters button[aria-pressed="true"] { background: var(--surface-2); color: var(--text); border-color: var(--line-2); font-weight: 550; }

/* School: calendari */
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.day { border-radius: 8px; padding: 8px 4px; text-align: center; background: var(--surface-2); min-width: 0; }
.day.today { box-shadow: inset 0 0 0 1px var(--accent); }
.day .w { font: 500 10px var(--mono); text-transform: uppercase; color: var(--faint); }
.day .n { font-size: 16px; font-weight: 620; }
.day .dots { display: flex; justify-content: center; gap: 3px; height: 8px; margin-top: 4px; }
.day .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--school); }
.day .dots i.test { background: var(--bad); }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .h { font: 500 10px var(--mono); color: var(--faint); text-transform: uppercase; text-align: center; padding-bottom: 2px; }
.cal .c { min-height: 64px; border-radius: 7px; background: var(--surface-2); border: 1px solid var(--line); padding: 4px 5px; font-size: 11px; min-width: 0; overflow: hidden; display: grid; align-content: start; gap: 3px; }
.cal .c.out { opacity: .35; }
.cal .c.we { background: transparent; border-style: dashed; }
.cal .c.past { opacity: .5; }
.cal .c.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.cal .c b { display: block; font-size: 11px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
.cal .c.today b { color: var(--accent); font-weight: 650; }
.cal .ev { display: block; border-radius: 4px; padding: 1px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 10.5px; line-height: 1.35; border: 0; text-align: left; cursor: pointer; font-family: inherit; width: 100%; }
.ev.test { background: var(--bad-soft); color: var(--bad); }
.ev.hw { background: var(--school-soft); color: var(--school); }
.ev.own { background: var(--warn-soft); color: var(--warn); }
.ev.notice { background: var(--accent-soft); color: var(--accent); }
.mcal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.mcal span { aspect-ratio: 1; border-radius: 5px; background: var(--surface-2); font-size: 10.5px; display: grid; place-items: center; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 0; }
.mcal .h { background: none; aspect-ratio: auto; font: 500 10px var(--mono); color: var(--faint); text-transform: uppercase; padding-bottom: 2px; }
.mcal .x { background: transparent; color: var(--line-2); }
.mcal .fu { background: transparent; box-shadow: inset 0 0 0 1px var(--line); color: var(--faint); }
.mcal .a { background: var(--bad); color: var(--on-accent); font-weight: 650; }
.mcal .r { background: var(--warn); color: var(--on-accent); font-weight: 650; }
.mcal .u { background: var(--c4); color: var(--on-accent); font-weight: 650; }
.mcal .t { box-shadow: inset 0 0 0 1px var(--accent); color: var(--text); }
.months { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; background: var(--surface-2); }
.sw.abs { background: var(--bad); } .sw.late { background: var(--warn); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.tile { display: grid; gap: 6px; width: 100%; text-align: left; border: 1px solid var(--line); border-radius: var(--r); padding: 12px; background: var(--surface); cursor: pointer; min-width: 0; color: var(--text); align-content: start; }
.tile:hover { border-color: var(--line-2); background: var(--surface-2); }
.tile .t { font-weight: 600; display: flex; align-items: center; gap: 8px; }
.tile .v { font-size: 26px; font-weight: 620; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.tile .d { font-size: 12px; color: var(--faint); }
.subject-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.subject { border-radius: 8px; padding: 12px; background: var(--surface-2); }
.subject .v { font-size: 22px; font-weight: 650; }
.subject .d { font-size: 12px; color: var(--muted); }
.ask { display: flex; gap: 8px; }
.ask input { flex: 1; min-width: 0; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); }
.ask button { padding: 8px 12px; border-radius: 8px; border: 0; background: var(--surface-2); color: var(--faint); }

/* Finance e componenti comuni */
.hero-money { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.hero-money .big { font-size: 26px; }
.accounts { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.acct { border-radius: 8px; padding: 12px; background: var(--surface-2); border: 1px solid var(--line); min-width: 0; display: grid; gap: 6px; align-content: start; }
.acct .k { font-size: 12px; color: var(--faint); display: flex; align-items: center; gap: 6px; }
.acct .v { font-size: 18px; font-weight: 620; font-variant-numeric: tabular-nums; }
.acct.closed { background: none; border-style: dashed; }
.searchbox { display: flex; gap: 8px; margin-bottom: 12px; }
.searchbox input { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--text); -webkit-appearance: none; appearance: none; }
.card .searchbox { margin: 0; }
.hit { display: flex; flex: 1; min-width: 0; border: 0; background: none; padding: 0; margin: 0; text-align: left; font: inherit; color: inherit; cursor: pointer; }
.hit:hover .t, .hit:focus-visible .t { text-decoration: underline; }
.ext { flex: none; align-self: center; font-size: 12.5px; color: var(--accent); text-decoration: none; white-space: nowrap; padding: 4px 0 4px 10px; display: inline-flex; align-items: center; gap: 5px; }
.ext:hover { text-decoration: underline; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 5px 14px; margin: 0; font-size: 13px; }

  const x = v => x0 + (Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo) * (xr - x0);

    + `<line x1="${x(6)}" x2="${x(6)}" y1="0" y2="${n * rh}" stroke="var(--good)" stroke-dasharray="3 3" opacity=".8"/>`
    + [2, 3, 4, 5, 6, 7, 8, 9, 10].map(v => `<text x="${x(v)}" y="${H - 6}" text-anchor="middle" font-size="10.5" fill="${v === 6 ? "var(--good)" : "var(--faint)"}">${v}</text>`).join("");
  rows.forEach((r, i) => {
    const cy = i * rh + rh / 2, m = r.mean, col = m == null ? "var(--faint)" : m < 6 ? "var(--bad)" : "var(--text)";

    let g = `<rect class="bg" x="0" y="${cy - rh / 2 + 1}" width="${W}" height="${rh - 2}" rx="5" fill="transparent"/><text x="2" y="${cy + 4}" font-size="12" fill="var(--muted)">${esc(name)}<title>${esc(r.name)}</title></text>`
      + `<line x1="${x0}" x2="${xr}" y1="${cy}" y2="${cy}" stroke="var(--line)"/>`;
    if (!r.vals.length && m == null) g += `<line x1="${x0}" x2="${xr}" y1="${cy}" y2="${cy}" stroke="var(--line-2)" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 7" opacity=".7"/>`;
    else {
      g += r.vals.map(v => `<circle cx="${x(v)}" cy="${cy}" r="4.5" fill="${v < 6 ? "var(--bad)" : "var(--school)"}" fill-opacity=".55"><title>${esc(r.name + " · " + num(v))}</title></circle>`).join("");
      if (m != null) g += `<rect x="${x(m) - 1.5}" y="${cy - 9}" width="3" height="18" rx="1.5" fill="${col}"/><text x="${W - 2}" y="${cy + 4}" text-anchor="end" font-size="12.5" font-weight="650" fill="${col}">${num(m, 2)}</text>`;

}
/* Calendario di due settimane (da lunedì di questa settimana): verifiche in rosso, compiti in viola, impegni in ambra. */
function twoWeeks(items, ref) {

  let h = ["lun", "mar", "mer", "gio", "ven", "sab", "dom"].map(g => `<div class="h">${g}</div>`).join("");
  for (let i = 0; i < 14; i++) {

    const iso = isoOf(c), evs = items.filter(x => x.date === iso), wd = i % 7;
    const cls = [wd > 4 ? "we" : "", iso < ref ? "past" : "", iso === ref ? "today" : ""].filter(Boolean).join(" ");

      return k ? `<button class="ev ${KIND_TXT[x.kind][1]}" data-sheet="agenda" data-id="${esc(k)}" title="${esc(KIND_TXT[x.kind][0] + ": " + (x.text || ""))}">${esc(t)}</button>` : `<span class="ev ${KIND_TXT[x.kind][1]}">${esc(t)}</span>`; }).join("")}${evs.length > 3 ? `<span class="ev" style="color:var(--faint)">+${evs.length - 3}</span>` : ""}</div>`;

/* Mese delle presenze in piccolo, come il calendario delle verifiche: rosso assenza, ambra ritardo, azzurro uscita.

  const first = d(ym + "-01"), m0 = first.getMonth(), off = (first.getDay() + 6) % 7, days = new Date(first.getFullYear(), m0 + 1, 0).getDate();
  let h = ["lun", "mar", "mer", "gio", "ven", "sab", "dom"].map(g => `<span class="h">${g.slice(0, 1)}</span>`).join("") + `<span class="x"></span>`.repeat(off);

    const abs = evs.some(e => /assenza/i.test(e.tipo)), late = evs.some(e => /ritardo/i.test(e.tipo)), out = evs.some(e => /uscita/i.test(e.tipo));
    const cls = abs ? "a" : late ? "r" : out ? "u" : wd === 6 ? "x" : iso > ref ? "fu" : iso === ref ? "t" : "";
    const what = abs ? "assenza" : late ? "ritardo" : out ? "uscita anticipata" : iso > ref ? "giorno futuro" : "nessuna registrazione";
    h += `<span class="${cls}" title="${esc(fday(iso) + ": " + what)}">${k}</span>`;

/* Anello del mese con due soglie: si riempie fino al limite massimo (tetto); la tacca segna il budget (obiettivo).
   Verde sotto il budget, ambra tra budget e limite, rosso oltre il limite. */
function budgetRing(spent, budget, cap) {
  const top = cap || budget, R = 40, C = 2 * Math.PI * R, sz = 96, c0 = sz / 2;
  if (!top) return ring(null);
  const p = Math.max(0, Math.min(spent / top, 1)), col = spent > top ? "var(--bad)" : budget && spent > budget ? "var(--warn)" : "var(--money)";
  const tick = budget && cap && budget < cap ? (() => { const a = budget / cap * 2 * Math.PI - Math.PI / 2;
    return `<line x1="${c0 + (R - 7) * Math.cos(a)}" y1="${c0 + (R - 7) * Math.sin(a)}" x2="${c0 + (R + 7) * Math.cos(a)}" y2="${c0 + (R + 7) * Math.sin(a)}" stroke="var(--text)" stroke-width="2" stroke-linecap="round"/>`; })() : "";
  return `<svg viewBox="0 0 ${sz} ${sz}" width="100%" style="max-width:96px;display:block" role="img" aria-label="${Math.round(spent / top * 100)} per cento del limite">
    <circle cx="${c0}" cy="${c0}" r="${R}" fill="none" stroke="var(--surface-2)" stroke-width="8"/>
    ${p > 0 ? `<circle cx="${c0}" cy="${c0}" r="${R}" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${(p * C).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 ${c0} ${c0})"/>` : ""}${tick}
    <text x="${c0}" y="${c0 + 2}" text-anchor="middle" font-size="17" font-weight="650" fill="var(--text)">${num(spent / 100, 0)} €</text>
    <text x="${c0}" y="${c0 + 17}" text-anchor="middle" font-size="10" fill="var(--faint)">di ${num(top / 100, 0)} €</text></svg>`;
}

/* Grafici (stile del confronto 04/11): griglia leggera tratteggiata, barre con angoli arrotondati appoggiate alla base,

let GID = 0;
const gridLine = (x1, x2, y) => `<line x1="${x1}" x2="${x2}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="2 4"/>`;
const axisText = (x, y, t, anchor) => `<text x="${x}" y="${y}" text-anchor="${anchor || "end"}" font-size="11.5" fill="var(--muted)">${esc(t)}</text>`;
const fade = (id, color) => `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${color};stop-opacity:.32"/><stop offset="1" style="stop-color:${color};stop-opacity:0"/></linearGradient></defs>`;

const pathOf = pts => pts.map(([px, py], i) => (i ? "L" : "M") + px.toFixed(1) + " " + py.toFixed(1)).join(" ");
const niceTop = v => { const e = 10 ** Math.floor(Math.log10(v || 1)), f = v / e; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e; };
const dotAt = (cx, cy, r, color, title, attr) => `<g${attr ? ` class="hit" ${attr}` : ""}>${attr ? `<circle cx="${cx}" cy="${cy}" r="14" fill="transparent"/>` : ""}<circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}" stroke="var(--surface)" stroke-width="2">${title ? `<title>${esc(title)}</title>` : ""}</circle></g>`;
/* punti: [{v, x, color, title, attr}] (attr: attributi per aprire il dettaglio) */
function lineChart(points, { min, max, threshold, label }) {
  const W = narrow() ? 340 : 640, H = narrow() ? 200 : 230, P = { l: 30, r: 14, t: 14, b: 28 }, id = "f" + (++GID);
  const x = i => P.l + (points.length < 2 ? (W - P.l - P.r) / 2 : i * (W - P.l - P.r) / (points.length - 1));
  const y = v => P.t + (1 - (v - min) / (max - min)) * (H - P.t - P.b);

    ${[0, 1, 2, 3, 4].map(k => min + k * (max - min) / 4).map(v => gridLine(P.l, W - P.r, y(v)) + axisText(P.l - 8, y(v) + 4, num(v, 1))).join("")}
    ${threshold != null ? `<line x1="${P.l}" x2="${W - P.r}" y1="${y(threshold)}" y2="${y(threshold)}" stroke="var(--bad)" stroke-width="1.5" stroke-dasharray="5 5" opacity=".8"/>` : ""}
    ${pts.length > 1 ? `<path d="${line} L${pts[pts.length - 1][0]} ${H - P.b} L${pts[0][0]} ${H - P.b} Z" fill="url(#${id})"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>` : ""}
    ${points.map((p, i) => dotAt(x(i), y(p.v), 5, p.color || "var(--accent)", p.title, p.attr)).join("")}
    ${points.map((p, i) => (i % step === 0 || i === points.length - 1) ? axisText(x(i), H - 8, p.x, "middle") : "").join("")}

/* colonne raggruppate o impilate: groups = [{x, values: [{name, v, color}], attr?, on?}]; attr rende il gruppo toccabile */
function columns(groups, { label, fmt, stacked, w, values, lines, h }) {
  const W = narrow() ? 340 : w || 640, H = narrow() ? 200 : h || 230, P = { l: 48, r: 8, t: values ? 22 : 14, b: 28 };
  const top = niceTop(Math.max(...groups.map(g => stacked ? sum(g.values.map(v => v.v)) : Math.max(...g.values.map(v => v.v))), ...(lines || []).map(l => l.v), 1) * (values ? 1.05 : 1));
  const y = v => P.t + (1 - v / top) * (H - P.t - P.b), base = y(0);
  const gw = (W - P.l - P.r) / groups.length, n = stacked ? 1 : groups[0].values.length, gap = 3, bw = Math.max(4, Math.min(24, (gw * .74 - (n - 1) * gap) / n));
  let out = [0, .5, 1].map(k => gridLine(P.l, W - P.r, y(top * k)) + axisText(P.l - 8, y(top * k) + 4, fmt(top * k))).join("")
    // linee di riferimento senza scritte: i nomi stanno nella legenda sotto il grafico (le scritte si sovrapponevano)
    + (lines || []).map(l => `<line x1="${P.l}" x2="${W - P.r}" y1="${y(l.v)}" y2="${y(l.v)}" stroke="${l.color}" stroke-width="1.3" stroke-dasharray="5 4"/>`).join("");
  groups.forEach((g, i) => {
    const cx = P.l + gw * i + gw / 2, last = g.values.map(v => v.v > 0).lastIndexOf(true);
    let acc = 0, bars = "";
    g.values.forEach((v, j) => {
      if (!(v.v > 0)) return;
      const h = (base - P.t) * v.v / top, t = `<title>${esc(g.x + " · " + v.name + ": " + fmt(v.v))}</title>`;
      if (stacked) {
        const yt = y(acc + v.v), x0 = cx - bw / 2;
        bars += `<path d="${j === last ? topRound(x0, yt, bw, h, 5) : `M${x0} ${yt + h}V${yt + 2}H${x0 + bw}V${yt + h}Z`}" fill="${v.color}">${t}</path>`;
        acc += v.v;
      } else { const bx = cx - (n * bw + (n - 1) * gap) / 2 + j * (bw + gap);
        bars += `<path d="${topRound(bx, y(v.v), bw, h, 4)}" fill="${v.color}">${t}</path>` + (values ? `<text x="${bx + bw / 2}" y="${y(v.v) - 5}" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--muted)">${esc(fmt(v.v))}</text>` : ""); }

    const lab = `<text x="${cx}" y="${H - 8}" text-anchor="middle" font-size="12" font-weight="${g.on ? 700 : 400}" fill="${g.on ? "var(--text)" : "var(--muted)"}">${esc(g.x)}</text>`;
    out += g.attr ? `<g class="hit${g.on ? " on" : ""}" ${g.attr} tabindex="0" role="button" aria-label="${esc(g.x)}"><rect class="bg" x="${cx - gw / 2 + 2}" y="${P.t - 6}" width="${gw - 4}" height="${H - P.t + 4}" rx="10" fill="transparent"/>${bars}${lab}</g>` : bars + lab;

function donut(parts, label, center) {
  const total = sum(parts.map(p => p.v)) || 1, R = 52, C = 2 * Math.PI * R, shown = parts.filter(p => p.v > 0);
  let off = 0;

    <svg viewBox="0 0 140 140" width="140" height="140" role="img" aria-label="${esc(label)}"><circle r="${R}" cx="70" cy="70" fill="none" stroke="var(--surface-2)" stroke-width="16"/>${arcs.join("")}
    <text x="70" y="68" text-anchor="middle" font-size="${center[0].length > 7 ? 15 : 22}" font-weight="750" fill="var(--text)">${esc(center[0])}</text><text x="70" y="88" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(center[1])}</text></svg>
    <div class="legend" style="flex-direction:column;margin:0">${parts.map(p => `<span><i style="background:${p.color}"></i>${esc(p.name)} · <b class="num">${esc(p.label)}</b></span>`).join("")}</div></div>`;

/* anello del budget: p = speso / budget (null = nessun budget: anello vuoto) */
function ring(p) {
  const R = 46, C = 2 * Math.PI * R, has = p != null, len = has ? Math.min(p, 1) * C : 0, col = !has ? "" : p > 1 ? "var(--bad)" : p > .85 ? "var(--warn)" : "var(--accent)";
  return `<svg viewBox="0 0 120 120" width="100%" style="max-width:120px;display:block" role="img" aria-label="${has ? Math.round(p * 100) + " per cento del budget usato" : "nessun budget impostato"}">
    <circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--surface-2)" stroke-width="13"/>
    ${len > 0 ? `<circle cx="60" cy="60" r="${R}" fill="none" stroke="${col}" stroke-width="13" stroke-linecap="round" stroke-dasharray="${len.toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 60 60)"/>` : ""}
    <text x="60" y="${has ? 63 : 60}" text-anchor="middle" font-size="${has ? 24 : 17}" font-weight="800" fill="var(--text)">${has ? Math.round(p * 100) + "%" : "—"}</text>
    <text x="60" y="${has ? 81 : 78}" text-anchor="middle" font-size="11" fill="var(--muted)">${has ? "del budget" : "nessun budget"}</text></svg>`;

/* spesa accumulata giorno per giorno: a = mese scelto, b = mese prima (importi minimi), budget del mese scelto */
function cumChart(a, b, budget, code, label, cap) {
  const W = narrow() ? 340 : 520, H = narrow() ? 196 : 230, P = { l: 50, r: 14, t: 18, b: 26 }, id = "f" + (++GID);
  const days = Math.max(28, a.length, b.length), top = niceTop(Math.max(100, ...a, ...b, budget || 0, cap || 0) * 1.08);
  const x = dd => P.l + (dd - 1) / (days - 1) * (W - P.l - P.r), y = v => P.t + (1 - Math.max(0, v) / top) * (H - P.t - P.b);
  const pa = a.map((v, i) => [x(i + 1), y(v)]), pb = b.map((v, i) => [x(i + 1), y(v)]);
  let out = fade(id, "var(--accent)") + [0, top / 2, top].map(v => gridLine(P.l, W - P.r, y(v)) + axisText(P.l - 8, y(v) + 4, num(v / 100, 0) + " €")).join("");
  if (budget) out += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(budget)}" y2="${y(budget)}" stroke="var(--warn)" stroke-width="1.3" stroke-dasharray="5 4"/>` + `<text x="${W - P.r}" y="${y(budget) - 5}" text-anchor="end" font-size="10.5" fill="var(--warn)">budget ${esc(cur(budget, code))}</text>`;
  if (cap && cap !== budget) out += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(cap)}" y2="${y(cap)}" stroke="var(--bad)" stroke-width="1.3" stroke-dasharray="5 4"/>` + `<text x="${W - P.r}" y="${y(cap) - 5}" text-anchor="end" font-size="10.5" fill="var(--bad)">limite ${esc(cur(cap, code))}</text>`;
  if (pb.length > 1) out += `<path d="${pathOf(pb)}" fill="none" stroke="var(--faint)" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"/>`;
  if (pa.length > 1) out += `<path d="${pathOf(pa)} L${pa[pa.length - 1][0]} ${y(0)} L${pa[0][0]} ${y(0)} Z" fill="url(#${id})"/><path d="${pathOf(pa)}" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>`;
  if (pa.length) out += dotAt(pa[pa.length - 1][0], pa[pa.length - 1][1], 5, "var(--accent)", cur(a[a.length - 1], code));
  out += [1, 8, 15, 22, days].map(dd => axisText(x(dd), H - 7, String(dd), "middle")).join("");

/* ultimi voti: linea con area sfumata, linea del 6, pallini colorati che aprono il voto */
function spark(points, W = 320) {

  const lo = Math.min(4, Math.floor(Math.min(...vals))), hi = 10;
  const x = i => P.l + (points.length < 2 ? (W - P.l - P.r) / 2 : i / (points.length - 1) * (W - P.l - P.r)), y = v => P.t + (1 - (v - lo) / (hi - lo)) * (H - P.t - P.b);

    <text x="${W - 2}" y="${y(6) + 4}" text-anchor="end" font-size="11" fill="var(--bad)">6</text>
    ${pts.length > 1 ? `<path d="${pathOf(pts)} L${pts[pts.length - 1][0]} ${H - P.b} L${pts[0][0]} ${H - P.b} Z" fill="url(#${id})"/><path d="${pathOf(pts)}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>` : ""}
    ${points.map((p, i) => dotAt(pts[i][0], pts[i][1], i === points.length - 1 ? 6 : 4.5, tone(p.v), p.title, p.attr)).join("")}</svg>`;

function calendarMonth(monthOf, events, today) {
  const first = d(monthOf.slice(0, 8) + "01"), y0 = first.getFullYear(), m0 = first.getMonth();
  const start = new Date(first); start.setDate(1 - ((first.getDay() + 6) % 7));
  let cells = ["lun","mar","mer","gio","ven","sab","dom"].map(g => `<div class="h">${g}</div>`).join("");
  for (let i = 0; i < 42; i++) {
    const c = new Date(start); c.setDate(start.getDate() + i);
    if (i >= 35 && c.getMonth() !== m0) break;
    const iso = `${c.getFullYear()}-${String(c.getMonth() + 1).padStart(2, "0")}-${String(c.getDate()).padStart(2, "0")}`;
    const evs = events.filter(e => e.date === iso);
    cells += `<div class="c${c.getMonth() !== m0 ? " out" : ""}${iso === (today || TODAY) ? " today" : ""}"><b>${c.getDate()}</b>${evs.map(e => `<span class="ev ${e.cls}" title="${esc(e.label)}">${esc(e.label)}</span>`).join("")}</div>`;
  }

  ["patrimonio", "Patrimonio netto", "layers"], ["investimenti", "Investimenti", "arrowU", "soon"], ["appunti", "Appunti", "note"]
];
const M = MONEY;
const observed = () => M.accounts.filter(a => a.status === "observed");
const liquidity = () => sum(observed().filter(a => a.group === "liquidity").map(a => a.balanceMinor));
const savings = () => sum(observed().filter(a => a.group === "savings").map(a => a.balanceMinor));
const balancesComplete = () => M.accounts.every(a => a.status === "observed");
const lastMonth = () => M.months[M.months.length - 1];
const credit = () => sum(M.obligations.filter(o => o.direction === "in").map(o => o.minor));
const debt = () => sum(M.obligations.filter(o => o.direction === "out").map(o => o.minor));
const stateChip = a => a.status === "observed" ? chip("osservato " + fday(a.observedOn), "good") : a.status === "conflict" ? chip("in conflitto", "bad") : chip("saldo mancante", "bad");
const recChip = a => a.reconciled === "ok" ? chip("riconciliato", "good") : a.reconciled === "difference" ? chip("differenza", "bad") : chip("non riconciliato");
let moneyFilter = "tutti";

const txItem = t => `<li>${dateBox(t.date)}<div class="main"><div class="t">${esc(t.desc)}</div><div class="d">${esc(t.account)} · ${t.category ? esc(t.category) : "<b>da classificare</b>"}${t.status === "pending" ? " · in attesa" : ""}</div></div><span class="r ${t.minor > 0 ? "pos" : ""}">${eur(t.minor, true)}</span></li>`;
const flows = () => columns(M.months.map(m => ({ x: m.m, values: [{ name: "Entrate", v: m.income / 100, color: "var(--money)" }, { name: "Uscite", v: m.spend / 100, color: "var(--c2)" }] })), { label: "Entrate e uscite per mese", fmt: v => num(v, 0) + " €" }) + legend([{ name: "Entrate", color: "var(--money)" }, { name: "Uscite", color: "var(--c2)" }]);

  if (!bridged()) { MAT_SEARCH.doc = null; MAT_SEARCH.error = "la ricerca legge i dati dal ponte locale: apri CUORE da CUORE.command"; render(); return; }
  MAT_SEARCH.loading = true; render();
  try {
    const d = await searchApi(q);
    if (my !== MAT_SEARCH.seq) return;
    MAT_SEARCH.doc = d;
  } catch (e) { if (my !== MAT_SEARCH.seq) return; MAT_SEARCH.doc = null; MAT_SEARCH.error = loadError(e); }
  MAT_SEARCH.loading = false; render();
}
function materialResults() {

  const hits = d.risultati.filter(r => r.modulo === "school" && (r.rotta === "school/materiali" || typeof r.link === "string"));
  if (!hits.length) return empty("Nessun materiale trovato", `per «${d.domanda}» in titoli e metadati`);
  return list(hits.map(r => {
    const read = /contenuto letto/.test(r.dettaglio || ""), unread = /contenuto non letto/.test(r.dettaglio || "");
    const det = String(r.dettaglio || "").replace(/ · contenuto (letto|non letto)[^·]*/, "");

    return `<li><div class="main"><div class="t">${esc(r.titolo)}</div><div class="d">${esc([r.tipo, det, r.data].filter(Boolean).join(" · "))}</div></div>${read ? chip("contenuto letto", "good") : unread ? chip("solo titolo e metadati") : ""}${ext}</li>`;
  })) + (d.omessi ? `<p class="note">${d.omessi} risultati oltre il limite non mostrati: affina la ricerca.</p>` : "");

function parse(route) {
  const [app, raw, param] = String(route || "").replace(/^#?\/?/, "").split("/");
  if (!APPS[app]) return { app: "home", section: null };
  const section = (ALIASES[app] || {})[raw] || raw, ok = APPS[app].sections.some(s => s[0] === section);
  const r = { app, section: ok ? section : APPS[app].sections[0][0] };
  if (ok && param) r.param = decodeURIComponent(param);
  return r;
}
function viewHtml(r) {
  if (r.app === "home") return homeView();
  if (r.app === "cuore") return SYSTEM_VIEWS[r.section]();
  const st = STATES()[r.app], sl = statusLine(r.app, CODES[r.app][r.section] + ".1");
  if (st.mode === "real") return sl + (r.app === "money" ? MONEY_REAL_VIEWS[r.section](r) + moneySource(r.section) : SCHOOL_REAL_VIEWS[r.section](r));
  if (r.app === "money" && r.section === "appunti" && st.mode !== "demo") return sl + notesView();     // appunti: non dipendono dal feed Finance
  if (st.mode === "loading") return sl;
  if (st.mode === "error") return sl + (r.app === "money" ? moneyUnavailable() : schoolUnavailable() + `<p class="note">Stato dell'aggiornamento automatico: <button class="link" data-route="cuore/automazioni">Sistema → Automazioni</button></p>`);
  const v = APPS[r.app].views[r.section], sec = APPS[r.app].sections.find(s => s[0] === r.section);
  return sl + (v ? v() : `<div class="grid">${card("s12", esc(sec[1]), empty("Disponibile con i dati reali", VETRINA ? "Questa sezione non ha una versione dimostrativa e non è disponibile nella vetrina." : "Questa sezione non ha una versione dimostrativa: apri CUORE dal ponte locale."))}</div>`);
}
let current = parse(typeof location !== "undefined" ? location.hash : "");
const KEEP_FOCUS = ["q", "mq", "txq"];                                   // le ricerche restano attive mentre si scrive
function render() {
  const r = current, app = APPS[r.app];

  const ae = typeof document.activeElement !== "undefined" && document.activeElement;
  const keep = ae && KEEP_FOCUS.includes(ae.id) ? [ae.id, ae.selectionStart] : null;

  const hd = r.app === "money" && document.querySelector("#view .head");

  document.getElementById("subnav").innerHTML = secs;

  if (tabs && !tabs.innerHTML) tabs.innerHTML = [["home", "Home"], ["school", "School"], ["money", "Finance"], ["cuore", "Sistema", "sys"]].map(([k, l, i]) => `<button class="nav-btn" data-route="${k}"><span class="ic">${ic(i || k, 20)}</span>${l}</button>`).join("");

function go(route) {
  if (SHEET) closeSheet();

  render();

/* «Aggiorna dalla banca»: legge subito MPS e Revolut (oltre ai giri di mattina e sera), al massimo 2 volte al giorno. */
